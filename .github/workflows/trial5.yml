name: 試運転5（発行済株式数の推移で、分割を見つける）

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: 報告書を探す期間の最初の日（YYYY-MM-DD）
        default: "2026-06-01"
      date_to:
        description: 報告書を探す期間の最後の日
        default: "2026-06-30"
      sample:
        description: 取り出す会社の数（証券コード順にまんべんなく選ぶ。最大600）
        default: "300"
      codes:
        description: 必ず入れたい会社の証券コード（4桁、カンマ区切り）
        default: "6758,9984,8035,7203,9432,8058,4502,8306"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      DATE_FROM: ${{ inputs.date_from }}
      DATE_TO: ${{ inputs.date_to }}
      SAMPLE: ${{ inputs.sample }}
      TARGET_CODES: ${{ inputs.codes }}
    steps:
      - name: 発行済株式数で分割を見つけられるか試す
        run: |
          python3 - <<'PY'
          import csv, datetime, io, json, os, sys, time, zipfile
          import urllib.error, urllib.parse, urllib.request
          from collections import Counter

          KEY = "".join(os.environ.get("EDINET_API_KEY", "").split())
          DATE_FROM = os.environ.get("DATE_FROM", "").strip()
          DATE_TO = os.environ.get("DATE_TO", "").strip()
          try:
              SAMPLE = max(1, min(int(os.environ.get("SAMPLE", "300")), 600))
          except ValueError:
              SAMPLE = 300
          MUST = [c.strip()[:4] for c in os.environ.get("TARGET_CODES", "").split(",") if c.strip()]
          BASE = os.environ.get("EDINET_BASE", "https://api.edinet-fsa.go.jp/api/v2")
          SLEEP = float(os.environ.get("SLEEP", "1.5"))
          RATIO_LIMIT = 1.25  # 配当を受けた株数の比がこれを超えたら、分割の疑い


          def note(title, msg):
              # 注記（Annotations）に出す。改行は %0A、% は %25 に直す
              msg = msg.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::notice title={title}::{msg}")


          def get(path, **params):
              # 通信先のURL（キー入り）は、画面に出さない
              params["Subscription-Key"] = KEY
              url = f"{BASE}/{path}?{urllib.parse.urlencode(params)}"
              last = None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "covera-labs-dividend-data-trial"})
                      with urllib.request.urlopen(req, timeout=90) as r:
                          return r.status, r.read()
                  except urllib.error.HTTPError as e:
                      last = e.code
                      if e.code == 429 and attempt < 2:
                          time.sleep(5 * (attempt + 1))
                          continue
                      return e.code, b""
                  except Exception as e:
                      last = type(e).__name__
                      time.sleep(2)
              return last, b""


          def weekdays(a, b, limit=45):
              d = datetime.date.fromisoformat(a)
              e = datetime.date.fromisoformat(b)
              n = 0
              while d <= e and n < limit:
                  if d.weekday() < 5:
                      yield d.isoformat()
                      n += 1
                  d += datetime.timedelta(days=1)


          def read_rows(zbytes):
              z = zipfile.ZipFile(io.BytesIO(zbytes))
              names = [n for n in z.namelist()
                       if n.lower().endswith(".csv") and "XBRL_TO_CSV" in n
                       and not os.path.basename(n).startswith("jpaud")]
              rows = []
              for n in names:
                  raw = z.read(n)
                  try:
                      text = raw.decode("utf-16")
                  except UnicodeDecodeError:
                      text = raw.decode("utf-16-le", errors="replace")
                  for r in csv.reader(io.StringIO(text.lstrip("﻿")), delimiter="\t", quotechar='"'):
                      if len(r) >= 9:
                          rows.append(r)
              return rows


          def num(s):
              try:
                  return float(s.replace(",", "").strip())
              except ValueError:
                  return None


          def pick(cands):
              """個別の印が付いた行を優先して、最初の数字を返す"""
              cands = [c for c in cands if c[1] is not None]
              if not cands:
                  return None
              for ctx, v in cands:
                  if "NonConsolidated" in ctx:
                      return v
              return cands[0][1]


          def norm_rel(label):
              return label.replace("期末", "期").replace("末", "").strip()


          def issued_series(rows, names):
              """有価証券報告書の5期分の表から、発行済株式総数の推移を取り出す"""
              series = {}
              best_elem = None
              for r in rows:
                  elem = r[0].split(":")[-1]
                  if "IssuedShares" in elem or "NumberOfShares" in elem or "発行済株式" in r[1]:
                      names[elem] += 1
                  if elem.startswith("TotalNumberOfIssuedShares") and elem.endswith("SummaryOfBusinessResults"):
                      best_elem = best_elem or elem
              if best_elem is None:
                  return series, None
              for r in rows:
                  if r[0].split(":")[-1] != best_elem:
                      continue
                  v = num(r[8])
                  if v is None or v <= 0:
                      continue
                  rel = norm_rel(r[3])
                  if rel not in series or "NonConsolidated" in r[2]:
                      series[rel] = v
              return series, best_elem


          def analyze(rows, names):
              annual, interim = [], []
              table = {}
              for r in rows:
                  elem = r[0].split(":")[-1]
                  if elem == "DividendPaidPerShareSummaryOfBusinessResults" and r[3] == "当期":
                      annual.append((r[2], num(r[8])))
                  elif elem == "InterimDividendPaidPerShareSummaryOfBusinessResults" and r[3] == "当期":
                      interim.append((r[2], num(r[8])))
                  elif "FilingDateInstant_Row" in r[2] and elem in (
                          "DividendPerShareDividendsOfSurplus", "TotalAmountOfDividendsDividendsOfSurplus",
                          "DateOfResolutionDividendsOfSurplus"):
                      t = table.setdefault(r[2], {})
                      key = {"DividendPerShareDividendsOfSurplus": "dps", "TotalAmountOfDividendsDividendsOfSurplus": "total",
                             "DateOfResolutionDividendsOfSurplus": "date"}[elem]
                      t[key] = num(r[8]) if key != "date" else r[8].strip()
              trows = sorted(([t.get("date", ""), t.get("dps"), t.get("total")] for t in table.values()), key=lambda x: x[0])
              dates = [x[0] for x in trows]
              sane = (len(dates) == len(set(dates))) and all((x[1] or 0) < 100000 for x in trows)
              shares = [t / p for _, p, t in trows if p and t and p > 0 and t > 0]
              ratio = (max(shares) / min(shares)) if (len(shares) >= 2 and sane) else None
              series, elem = issued_series(rows, names)
              cur, prev = series.get("当期"), series.get("前期")
              issued_ratio = (cur / prev) if (cur and prev) else None
              later = [(series.get(a), series.get(b)) for a, b in (("前期", "前々期"), ("前々期", "三期前"), ("三期前", "四期前"))]
              older_jumps = sum(1 for a, b in later if a and b and (a / b >= 1.4 or a / b <= 0.7))
              return {"annual": pick(annual), "interim": pick(interim), "rows": trows, "ratio": ratio, "sane": sane,
                      "issued_ratio": issued_ratio, "issued_elem": elem, "older_jumps": older_jumps, "series_n": len(series)}


          def main():
              if not KEY:
                  print("::error title=EDINET::EDINET_API_KEY が空です")
                  sys.exit(1)

              pool, scanned, bad = [], 0, []
              for day in weekdays(DATE_FROM, DATE_TO):
                  time.sleep(1.0)
                  st, body = get("documents.json", date=day, type="2")
                  scanned += 1
                  if st != 200:
                      bad.append(f"{day}:{st}")
                      continue
                  try:
                      for d in json.loads(body).get("results", []):
                          if (d.get("docTypeCode") == "120" and d.get("secCode") and d.get("csvFlag") == "1"
                                  and d.get("withdrawalStatus") == "0" and d.get("ordinanceCode") == "010"):
                              d["_date"] = day
                              pool.append(d)
                  except Exception:
                      bad.append(f"{day}:json")
              pool.sort(key=lambda d: d["secCode"])
              if not pool:
                  note("EDINET走査", f"有報が0件でした。一覧が取れなかった日: {', '.join(bad) or 'なし'}")
                  sys.exit(1)

              # 証券コード順に、まんべんなく選ぶ。指定した会社は、必ず入れる
              step = len(pool) / min(SAMPLE, len(pool))
              chosen = [pool[int(i * step)] for i in range(min(SAMPLE, len(pool)))]
              by4 = {d["secCode"][:4]: d for d in pool}
              missing = [c for c in MUST if c not in by4]
              for c in MUST:
                  if c in by4 and by4[c] not in chosen:
                      chosen.append(by4[c])
              note("EDINET走査", f"{DATE_FROM}〜{DATE_TO}（平日のみ）のうち{scanned}日を調べた / 有報{len(pool)}件 / 取り出す{len(chosen)}件"
                   + (f"\n一覧が取れなかった日: {', '.join(bad)}" if bad else "")
                   + (f"\nこの期間に無かった指定の会社: {', '.join(missing)}" if missing else ""))

              results, fails, consecutive = [], 0, 0
              names = Counter()
              for d in chosen:
                  time.sleep(SLEEP)
                  st, zb = get(f"documents/{d['docID']}", type="5")
                  if st != 200 or not zipfile.is_zipfile(io.BytesIO(zb)):
                      fails += 1
                      consecutive += 1
                      if consecutive >= 4:
                          note("EDINET中止", f"続けて4回取れなかったので、ここで止めた（最後のHTTP {st}）。取れた件数: {len(results)}")
                          break
                      continue
                  consecutive = 0
                  try:
                      a = analyze(read_rows(zb), names)
                  except Exception as e:
                      fails += 1
                      continue
                  a.update(code=d["secCode"][:4], name=(d.get("filerName") or "")[:12], must=d["secCode"][:4] in MUST)
                  results.append(a)

              SPLIT = lambda x: x is not None and (x >= 1.4 or x <= 0.7)
              tab_ok = [r for r in results if r["ratio"] is not None]
              tab_flag = [r for r in tab_ok if 1.25 < r["ratio"] <= 20]
              iss_ok = [r for r in results if r["issued_ratio"] is not None]
              iss_flag = [r for r in iss_ok if SPLIT(r["issued_ratio"])]
              both = [r for r in results if r["ratio"] is not None and r["issued_ratio"] is not None]
              only_iss_zone = [r for r in iss_ok if r["ratio"] is None]  # 決議の表では判定できなかった会社
              note("EDINET集計",
                   f"読めた{len(results)}件 / 取れなかった{fails}件\n"
                   f"発行済株式総数の推移が取れた（当期と前期）: {len(iss_ok)}件 / 取れない: {len(results) - len(iss_ok)}件\n"
                   f"決議の表で判定できた（同じ日付の重複などを除く）: {len(tab_ok)}件\n"
                   f"→ 決議の表では判定できなかったが、発行済株式数では判定できた: {len(only_iss_zone)}件\n"
                   f"当期に発行済株式数が1.4倍以上、または0.7倍以下になった: {len(iss_flag)}件\n"
                   f"決議の表の比が1.25超20以下（分割の疑い）: {len(tab_flag)}件\n"
                   f"両方で判定できた{len(both)}件の中で、両方が疑い: {sum(1 for r in both if r in tab_flag and r in iss_flag)}件"
                   f" / 表だけ: {sum(1 for r in both if r in tab_flag and r not in iss_flag)}件"
                   f" / 発行済だけ: {sum(1 for r in both if r not in tab_flag and r in iss_flag)}件"
                   f" / どちらでもない: {sum(1 for r in both if r not in tab_flag and r not in iss_flag)}件\n"
                   f"前期以前の年にも1.4倍以上・0.7倍以下の変化があった会社: {sum(1 for r in results if r['older_jumps'])}件")
              note("発行済株式数の項目名", "\n".join(f"{k}: {v}件" for k, v in names.most_common(12)) or "なし")

              def line(r):
                  rows = "; ".join(f"{(x[0] or '?')[5:]}:{x[1]}" for x in r["rows"][:4])
                  tr = f"表の比{r['ratio']:.2f}" if r["ratio"] else ("表は判定外" if r["rows"] else "表なし")
                  ir = f"発行済の比{r['issued_ratio']:.2f}" if r["issued_ratio"] else "発行済なし"
                  return f"{r['code']} {r['name']} | {ir} | {tr} | 年間{r['annual']} 中間{r['interim']} | {rows}"

              if iss_flag:
                  note("当期に発行済株式数が大きく変わった会社",
                       "\n".join(line(r) for r in sorted(iss_flag, key=lambda r: -abs(r["issued_ratio"] - 1))[:40]))
              onlytab = [r for r in both if r in tab_flag and r not in iss_flag]
              if onlytab:
                  note("決議の表だけが疑った会社", "\n".join(line(r) for r in onlytab[:20]))
              known = [r for r in results if r["must"]]
              if known:
                  note("指定した会社", "\n".join(line(r) for r in known))


          if __name__ == "__main__":
              main()
          PY
